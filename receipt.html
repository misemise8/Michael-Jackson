<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3文化祭 引換券</title>
  <link rel="stylesheet" href="css/receipt.css">
  <script src="js/api.js" defer></script>
  <script src="js/receipt.js" defer></script>
</head>
<body>
  <div class="screen-tools">
    <a href="regi.html">レジへ</a>
    <button type="button" id="printButton">印刷</button>
  </div>

  <main class="receipt" aria-label="S3文化祭 引換券">
    <header class="receipt-header">
      <p class="shop-label">S3 CULTURE FESTIVAL</p>
      <h1>S3文化祭</h1>
      <p class="subtitle">EXCHANGE TICKET</p>
    </header>

    <section class="receipt-section">
      <h2>注文内容</h2>
      <ul class="items" id="orderItems"></ul>
      <p class="empty-order" id="emptyOrder">注文を読み込み中です</p>
    </section>

    <section class="total-row" aria-label="合計金額">
      <span>合計金額</span>
      <strong id="orderTotal">￥0</strong>
    </section>

    <section class="ticket-id" aria-label="引換番号">
      <span>引換番号</span>
      <strong id="ticketNo">---</strong>
      <p>この番号で商品をお受け取りください</p>
    </section>

    <section class="order-info">
      <div>
        <span>日時</span>
        <time id="orderDateTime" datetime=""></time>
      </div>
    </section>
  </main>

  <p class="status-line" id="statusLine" aria-live="polite"></p>
</body>
</html>
