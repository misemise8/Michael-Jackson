<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3文化祭 注文画面</title>
  <link rel="stylesheet" href="order.css">
  <script src="order.js" defer></script>
</head>
<body>
  <main class="order-app">
    <header class="app-header">
      <div>
        <p>S3 CULTURE FESTIVAL</p>
        <h1>S3文化祭 注文画面</h1>
      </div>
      <a href="receipt.html" class="receipt-link">引換券</a>
    </header>

    <section class="menu-section" aria-label="メニュー">
      <h2>メニュー</h2>
      <div class="menu-grid" id="menuGrid"></div>
    </section>

    <aside class="cart-panel" aria-label="注文内容">
      <div class="cart-header">
        <h2>注文内容</h2>
        <button type="button" id="clearCart">クリア</button>
      </div>

      <ul class="cart-list" id="cartList"></ul>

      <p class="empty-message" id="emptyMessage">商品を選んでください</p>

      <div class="cart-total">
        <span>合計金額</span>
        <strong id="cartTotal">￥0</strong>
      </div>

      <button type="button" class="print-button" id="createReceipt">
        引換券を作成
      </button>
    </aside>
  </main>
</body>
</html>
